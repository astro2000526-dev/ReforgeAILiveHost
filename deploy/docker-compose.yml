# ReforgeAILiveHost — full single-server stack.
# Brought up by init.sh (which generates .env + downloads models first).
# All services share one network so they reach each other by service name.
#
# GPU: pipeline + lipsync + qwen each reserve the GPU; on a single-GPU box they
# share it (CUDA time-slices). Requires nvidia-container-toolkit on the host.

name: reforge

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

networks:
  reforge:
    name: reforge

services:
  # ── Lean Supabase: Postgres + PostgREST ────────────────────────────────────
  db:
    image: postgres:15
    container_name: reforge-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${SUPERPASS}
      POSTGRES_DB: postgres
    volumes:
      - ${DATA_DIR}/pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [reforge]

  rest:
    image: postgrest/postgrest:v12.2.3
    container_name: reforge-rest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTHPASS}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
    networks: [reforge]

  # ── GPU pipeline: TTS (MMS) + voice clone (OpenVoice) + ffmpeg + orchestrate ─
  pipeline:
    build:
      context: ../services/pipeline
      dockerfile: Dockerfile
    image: reforge-pipeline:latest
    container_name: reforge-pipeline
    restart: unless-stopped
    environment:
      PIPELINE_TOKEN: ${PIPELINE_TOKEN}
      PUBLIC_BASE_URL: http://api.${HOST_IP}.nip.io
      OLLAMA_URL: http://qwen:11434
      # How long the pipeline waits on the lip-sync service. MuseTalk is slow
      # (reloads models per call) — give it headroom; Wav2Lip finishes in secs.
      LIPSYNC_HTTP_TIMEOUT: "1800"
      HF_HOME: /workspace/tmp/hf
      HF_ENDPOINT: ${HF_MIRROR}
      MMS_SPEAKING_RATE: "1.0"
      # Azure Neural TTS (best Thai voices). Leave key blank → falls back to MMS.
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-eastus}
      # OpenVoice converter weights live on a mounted volume (the pip wheel ships
      # none); download-models.sh populates it.
      OPENVOICE_CONVERTER_DIR: /workspace/openvoice/converter
      MUSETALK_ENABLED: "0"
      GFPGAN_ENABLED: "0"
      TTS_PROVIDER: mms
      # ── GPU-call boundary (app/gpu) ────────────────────────────────────────
      # Default (unset) = local: inference runs in this container; lipsync goes
      # to the URL from Settings. To move ALL GPU work to another box running
      # this same image, set:
      #   GPU_BACKEND: remote
      #   GPU_BASE_URL: http://new-gpu-box:8000     # its /gpu/* worker routes
      #   GPU_TOKEN: ${PIPELINE_TOKEN}              # worker's PIPELINE_TOKEN
      # Per-capability override: GPU_TTS_BACKEND / GPU_VOICE_CLONE_BACKEND /
      # GPU_RESTORE_BACKEND / GPU_MATTE_BACKEND / GPU_MUSETALK_BACKEND /
      # GPU_LIPSYNC_BACKEND (+ GPU_LIPSYNC_URL) — migrate one task at a time.
      #
      # ── GPT-SoVITS HQ TTS (optional) ───────────────────────────────────────
      # Uncomment the `sovits` service below + this URL to enable. Pipeline
      # reaches the api.py box here; references live under SOVITS_REF_DIR.
      #   GPT_SOVITS_URL: http://sovits:9880
      #   SOVITS_HTTP_TIMEOUT: "300"
      #   SOVITS_REF_DIR: /workspace/sovits/refs
    volumes:
      - ${DATA_DIR}/pipeline/tmp:/workspace/tmp
      - ${DATA_DIR}/pipeline/output:/workspace/output
      - ${DATA_DIR}/pipeline/models:/workspace/MuseTalk/models
      - ${DATA_DIR}/pipeline/openvoice:/workspace/openvoice
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    <<: *gpu
    networks: [reforge]

  # ── GPU lipsync: Wav2Lip ────────────────────────────────────────────────────
  lipsync:
    build:
      context: ../services/lipsync
      dockerfile: Dockerfile
    image: reforge-lipsync:latest
    container_name: reforge-lipsync
    restart: unless-stopped
    environment:
      MODELS_DIR: /workspace/models
      WORK_DIR: /workspace/runtime
      DEVICE: cuda
      FP16: "true"
      TARGET_FPS: "25"
      # wav2lip (default, fast) | musetalk (higher quality but heavy + slow;
      # needs the 6GB weight set — init.sh downloads it when set to musetalk).
      LIPSYNC_MODEL: ${LIPSYNC_MODEL:-wav2lip}
      SAMPLE_RATE: "16000"
      # Disable TorchScript: torch 2.1.1's torch.jit.script segfaults while
      # mmengine imports (needed for MuseTalk's dwpose). Harmless for Wav2Lip.
      PYTORCH_JIT: "0"
    volumes:
      - ${DATA_DIR}/lipsync/models:/workspace/models
      - ${DATA_DIR}/lipsync/runtime:/workspace/runtime
    ports:
      - "127.0.0.1:8001:8000"
    <<: *gpu
    networks: [reforge]

  # ── GPU TTS: GPT-SoVITS api.py (optional, high-quality zero-shot) ───────────
  # Disabled by default. To enable: uncomment this block + the GPT_SOVITS_URL
  # env on the pipeline service above, drop your reference clips into
  # ${DATA_DIR}/sovits/refs (<voice>.wav + <voice>.txt), build the image, and
  # bring it up. See services/sovits/README.md for image + reference details.
  # sovits:
  #   build:
  #     context: ../services/sovits
  #     dockerfile: Dockerfile
  #   image: reforge-sovits:latest
  #   container_name: reforge-sovits
  #   restart: unless-stopped
  #   environment:
  #     # GPT-SoVITS api.py serves on this port (api.py -p 9880).
  #     SOVITS_PORT: "9880"
  #     # References api.py reads at inference time (refer_wav_path is box-local).
  #     SOVITS_REF_DIR: /workspace/sovits/refs
  #   volumes:
  #     # Pretrained GPT-SoVITS weights (download per README) + your references.
  #     - ${DATA_DIR}/sovits/models:/workspace/GPT-SoVITS/GPT_SoVITS/pretrained_models
  #     - ${DATA_DIR}/sovits/refs:/workspace/sovits/refs
  #   ports:
  #     - "127.0.0.1:9880:9880"
  #   <<: *gpu
  #   networks: [reforge]

  # ── Local LLM: Qwen2.5 via ollama (script gen + live auto-reply) ────────────
  qwen:
    image: ollama/ollama:latest
    container_name: reforge-qwen
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ${DATA_DIR}/ollama:/root/.ollama
    <<: *gpu
    networks: [reforge]

  # ── Web (Next.js): UI + API gateway ─────────────────────────────────────────
  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* are inlined at BUILD time by Next.js (not read at runtime),
      # so they MUST be passed here. They're server-internal URLs, harmless in
      # the client bundle (the browser talks to /api/*, never these directly).
      args:
        NEXT_PUBLIC_SUPABASE_URL: http://nginx:8088
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
        # Google login is off by default (demo mode). To enable, point the two
        # NEXT_PUBLIC_SUPABASE_* values at Supabase CLOUD (https://<ref>.supabase.co
        # + its anon key) and set this to 1. Inlined at build time, so a rebuild
        # is required. See deploy/HTTPS_OAUTH.md.
        NEXT_PUBLIC_AUTH_ENABLED: ${NEXT_PUBLIC_AUTH_ENABLED:-0}
    image: reforge-web:latest
    container_name: reforge-web
    restart: unless-stopped
    depends_on:
      - pipeline
      - rest
    environment:
      NODE_ENV: production
      # Env-driven so the no-GPU local stack can point at a host-run pipeline
      # (e.g. http://host.docker.internal:8111). Default = in-compose service.
      PIPELINE_API_URL: ${PIPELINE_API_URL:-http://pipeline:8000}
      PIPELINE_TOKEN: ${PIPELINE_TOKEN}
      NEXT_PUBLIC_SUPABASE_URL: http://nginx:8088
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_KEY}
      # Read at runtime by the server-side auth seam (current-user.ts). Mirror of
      # the build arg above — keep both in sync.
      NEXT_PUBLIC_AUTH_ENABLED: ${NEXT_PUBLIC_AUTH_ENABLED:-0}
    networks: [reforge]

  # ── Reverse proxy: public :80 vhosts + internal :8088 PostgREST gateway ─────
  nginx:
    image: nginx:1.27-alpine
    container_name: reforge-nginx
    restart: unless-stopped
    depends_on:
      - web
      - pipeline
      - lipsync
      - rest
    ports:
      - "${HTTP_PORT:-80}:80"
      # ── HTTPS (opt-in via scripts/enable-https.sh) ─────────────────────────
      # Uncomment to expose 443, then run enable-https.sh. See HTTPS_OAUTH.md.
      # - "443:443"
    # DOMAIN is consumed by enable-https.sh (not nginx itself); harmless if blank.
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ${DATA_DIR}/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${DATA_DIR}/pipeline/output:/srv/files:ro
      - ${DATA_DIR}/status:/usr/share/nginx/html/status:ro
      # ── HTTPS (opt-in) ─────────────────────────────────────────────────────
      # certbot writes certs to letsencrypt/ and the ACME challenge token to
      # certbot/; nginx reads the cert (TLS template) and serves the challenge
      # over :80. Uncomment BOTH, recreate nginx, then run enable-https.sh.
      # - ${DATA_DIR}/letsencrypt:/etc/letsencrypt:ro
      # - ${DATA_DIR}/certbot:/var/www/certbot:ro
    networks: [reforge]
